[workspace]
resolver = "2"
members = [
    "crates/sutra-nyaya",
    "crates/sutra-panini",
    "crates/sutra-gitvfs",
    "crates/sutra-wasm-host",
    "crates/sutra-kerneld",
    "crates/sutra-cli",
    "sdk/rust-actor-sdk",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "Apache-2.0"
authors      = ["SutraOS Contributors"]
repository   = "https://github.com/Aparnap2/sutra_os"
description  = "AI-native headless OS kernel for 24x7 autonomous DevOps self-healing"

[workspace.dependencies]
# Async runtime
tokio            = { version = "1.43",  features = ["full"] }
# Serialisation
serde            = { version = "1.0",   features = ["derive"] }
serde_json       = "1.0"
toml             = "0.8"
# Error handling
thiserror        = "2.0"
anyhow           = "1.0"
# Observability
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Crypto / IDs
sha2             = "0.10"
hex              = "0.4"
ulid             = "1.1"
# Git VFS  (skip gix for now – use git2 which is more stable on 1.93)
git2             = { version = "0.19", default-features = false }
# HTTP client
reqwest          = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# CLI
clap             = { version = "4.5",  features = ["derive"] }
# Glob matching
globset          = "0.4"
# Regex
regex            = "1"
# Wasmtime – use 27.x which is the latest stable on crates.io for 1.93
wasmtime         = { version = "27", features = ["component-model", "async", "cranelift"] }
wasmtime-wasi    = "27"
