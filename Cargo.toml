[workspace]
resolver = "3"
members = [
    "crates/axiom-verify",
    "crates/axiom-compile",
    "crates/axiom-gitvfs",
    "crates/axiom-mcp-bus",
    "crates/axiom-wasm-host",
    "crates/axiom-kerneld",
    "crates/axiom-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["SutraOS Contributors"]
repository = "https://github.com/Aparnap2/sutra_os"
description = "AI-native headless OS kernel for 24x7 autonomous operations"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full", "process", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
hex = "0.4"
ulid = "1.1"
git2 = { version = "0.19", default-features = false }
wasmtime = { version = "27", features = ["component-model", "async", "cranelift"] }
wasmtime-wasi = "27"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
clap = { version = "4.5", features = ["derive"] }
