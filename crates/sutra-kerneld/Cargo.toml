[package]
name    = "sutra-kerneld"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SūtraOS core async event reactor, Kuṭṭaka scheduler, REM garbage collector"

[[bin]]
name = "sutra-kerneld"
path = "src/main.rs"

[dependencies]
sutra-nyaya    = { path = "../sutra-nyaya" }
sutra-panini   = { path = "../sutra-panini" }
sutra-gitvfs   = { path = "../sutra-gitvfs" }
sutra-wasm-host = { path = "../sutra-wasm-host" }
tokio          = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
anyhow         = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
ulid           = { workspace = true }
