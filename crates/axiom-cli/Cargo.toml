[package]
name    = "axiom-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SūtraOS CLI: `sutra init`, `sutra trigger`, `sutra audit`"

[[bin]]
name = "axiom"
path = "src/main.rs"

[dependencies]
axiom-verify    = { path = "../axiom-verify" }
axiom-compile   = { path = "../axiom-compile" }
axiom-gitvfs   = { path = "../axiom-gitvfs" }
axiom-kerneld  = { path = "../axiom-kerneld" }
axiom-wasm-host = { path = "../axiom-wasm-host" }
git2           = { workspace = true }
tokio          = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
anyhow         = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
clap           = { workspace = true }
