[package]
name    = "sutra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SūtraOS CLI: `sutra init`, `sutra trigger`, `sutra audit`"

[[bin]]
name = "sutra"
path = "src/main.rs"

[dependencies]
sutra-nyaya    = { path = "../sutra-nyaya" }
sutra-panini   = { path = "../sutra-panini" }
sutra-gitvfs   = { path = "../sutra-gitvfs" }
sutra-kerneld  = { path = "../sutra-kerneld" }
tokio          = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
anyhow         = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
clap           = { workspace = true }
