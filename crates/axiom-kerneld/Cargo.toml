[package]
name    = "axiom-kerneld"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SūtraOS core async event reactor, Kuṭṭaka scheduler, REM garbage collector"

[[bin]]
name = "axiomd"
path = "src/main.rs"

[dependencies]
axiom-verify    = { path = "../axiom-verify" }
axiom-compile   = { path = "../axiom-compile" }
axiom-gitvfs   = { path = "../axiom-gitvfs" }
axiom-wasm-host = { path = "../axiom-wasm-host" }
tokio          = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
anyhow         = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
ulid           = { workspace = true }
